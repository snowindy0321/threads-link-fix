name: Release Morphe Patches

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1)'
        required: false
        default: '1.0.1'

permissions:
  contents: write
  packages: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Resolve Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(jq -r '.version' patches-bundle.json)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Build Patches (.mpp) with Morphe Plugin
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew || true
          gradle :patches:buildAndroid :patches:generatePatchesList -Pversion=${{ env.VERSION }} --no-daemon || \
            ./gradlew :patches:buildAndroid :patches:generatePatchesList -Pversion=${{ env.VERSION }} --no-daemon

      - name: Prepare Release Assets
        id: prepare
        run: |
          VERSION="${{ env.VERSION }}"
          
          # Find compiled MPP bundle
          MPP_FILE=$(find patches/build/libs -name "*.mpp" ! -name "*sources*" ! -name "*javadoc*" | head -n 1)
          if [ -z "$MPP_FILE" ]; then
            echo "Error: MPP file not found in patches/build/libs!"
            ls -la patches/build/libs || true
            exit 1
          fi
          
          mkdir -p dist
          cp "$MPP_FILE" "dist/patches-${VERSION}.mpp"
          
          # Format UTC date strictly as YYYY-MM-DDTHH:MM:SS (No 'Z' suffix, required by Morphe Manager)
          CREATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%S")
          
          # Update patches-bundle.json
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/patches-${VERSION}.mpp"
          jq --arg created "$CREATED_AT" \
             --arg ver "$VERSION" \
             --arg url "$DOWNLOAD_URL" \
             '.created_at = $created | .version = $ver | .download_url = $url' \
             patches-bundle.json > patches-bundle.json.tmp
          mv patches-bundle.json.tmp patches-bundle.json
          
          # Update patches-list.json
          jq --arg ver "$VERSION" '.version = $ver' patches-list.json > patches-list.json.tmp
          mv patches-list.json.tmp patches-list.json
          
          cp patches-bundle.json dist/
          cp patches-list.json dist/

      - name: Commit Updated Metadata to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json patches-list.json gradle.properties
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update patches metadata for v${VERSION} [skip ci]" && git push origin HEAD:main)

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Threads Link Fix v${{ env.VERSION }}"
          body: |
            ## Threads Link Fix v${{ env.VERSION }}

            專為 Meta Threads (`com.instagram.barcelona`) 設計的 Morphe 修補套件。

            ### 修復內容：
            * 修復點擊 IG 個人檔案連結失敗問題
            * 修復分享貼文至 IG 限時動態失敗問題
            * 完整相容 Morphe Manager 標準中繼資料與 classes.dex 格式

            ### 一鍵新增至 Morphe Manager：
            點擊 [新增至 Morphe Manager](https://morphe.software/add-source?github=${{ github.repository }})
          files: |
            dist/patches-${{ env.VERSION }}.mpp
            dist/patches-bundle.json
            dist/patches-list.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
