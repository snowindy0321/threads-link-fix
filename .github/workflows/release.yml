name: Build & Release Morphe Patch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Patch Package (.mpp)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build || gradle build || true
          else
            gradle build || true
          fi

      - name: Package MPP bundle
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.0.0"
          fi
          
          # If gradle generated an mpp, use it; otherwise package mpp bundle from classes/json
          MPP_FILE=$(find . -name "*.mpp" | head -n 1)
          if [ -n "$MPP_FILE" ]; then
            cp "$MPP_FILE" "dist/patches-${VERSION}.mpp"
          else
            echo "Creating patch bundle archive..."
            zip -r "dist/patches-${VERSION}.mpp" patches-list.json src/
          fi
          
          # Update download_url and version in patches-bundle.json
          sed -i "s/patches-[0-9.]*\.mpp/patches-${VERSION}.mpp/g" patches-bundle.json
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"${VERSION}\"/g" patches-bundle.json
          cp patches-bundle.json dist/
          cp patches-list.json dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            patches-bundle.json
            patches-list.json
          generate_release_notes: true
